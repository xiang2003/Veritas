<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Veritas 學習紀錄</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="wordbook.css" />
</head>
<body>
  <main class="book">
    <nav class="views" aria-label="學習紀錄">
      <button type="button" data-view="words">📒 生字本</button>
      <button type="button" data-view="mistakes">✏️ 錯誤本</button>
    </nav>
    <header>
      <div>
        <h1 id="heading"></h1>
        <div id="summary" class="muted"></div>
      </div>
      <button type="button" id="export" class="secondary">匯出 CSV</button>
    </header>
    <div class="controls">
      <div class="tabs" role="tablist">
        <button type="button" data-tab="learning" class="secondary"></button>
        <button type="button" data-tab="mastered" class="secondary"></button>
        <button type="button" data-tab="all" class="secondary">全部</button>
      </div>
      <input id="search" type="search" autocomplete="off" />
    </div>
    <p id="hint" class="muted hint"></p>
    <section id="list"></section>
  </main>
  <script src="wordbook.js"></script>
</body>
</html>
