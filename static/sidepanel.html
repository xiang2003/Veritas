<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Veritas</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <div>
      <strong>Veritas tutor</strong>
      <div id="title" class="article-title"></div>
    </div>
    <button type="button" id="open-options" class="secondary" title="Settings">⚙</button>
  </header>
  <div id="status" class="status" role="status"></div>
  <div id="error" class="error" role="alert"></div>
  <div id="log" class="log"></div>
  <button type="button" id="start" class="start" hidden>Start discussing this article</button>
  <footer>
    <button type="button" id="mic">🎤 Speak</button>
    <form id="send-form">
      <input id="text" type="text" placeholder="…or type your answer" autocomplete="off" />
      <button type="submit" id="send">Send</button>
    </form>
  </footer>
  <script src="sidepanel.js"></script>
</body>
</html>
