<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Veritas – Settings</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <main class="page">
    <h1>Veritas settings</h1>
    <form id="settings">
      <label>Gemini API key
        <input name="apiKey" type="password" autocomplete="off" placeholder="AIza…" />
        <small>Free key from <a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer">Google AI Studio</a>. Stored only in this browser.</small>
      </label>
      <label>Model
        <input name="model" type="text" />
      </label>
      <label>My level
        <select name="level">
          <option>B1</option><option>B2</option><option>C1</option><option>C2</option>
        </select>
        <small>Words above this level get underlined.</small>
      </label>
      <label>My interests
        <input name="interests" type="text" placeholder="e.g. technology, climate, economics" />
        <small>Used when recommending articles on news front pages.</small>
      </label>
      <label>Explain in
        <input name="nativeLanguage" type="text" placeholder="Traditional Chinese" />
      </label>
      <label>Speech speed (0.5 – 2)
        <input name="speechRate" type="number" min="0.5" max="2" step="0.05" />
      </label>
      <label class="row">
        <input name="autoHighlight" type="checkbox" /> Underline hard words automatically
      </label>
      <div class="actions">
        <button type="submit">Save</button>
        <button type="button" id="grant-mic" class="secondary">Enable microphone</button>
        <span id="status" role="status"></span>
      </div>
    </form>
  </main>
  <script src="options.js"></script>
</body>
</html>
